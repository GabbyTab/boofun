# Dependabot configuration for boofun
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"

  # Hash-pinned CI lockfiles (requirements/*.txt, compiled with uv)
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "ci"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # The codeql-action sub-actions (init/analyze/upload-sarif) must move
      # in lockstep: a workflow mixing versions fails with "Loaded a
      # configuration file for version X, but running version Y". Group
      # them so Dependabot proposes one PR instead of three unmergeable
      # ones (see PRs #70/#72).
      codeql-action:
        patterns:
          - "github/codeql-action*"
