name: CI

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5
      with:
        python-version: '3.11'

    - name: Install pre-commit
      run: pip install --require-hashes -r requirements/lint.txt

    - name: Run pre-commit hooks
      run: pre-commit run --all-files

    # Recompile the requirements/*.txt lockfiles and fail on any diff, so
    # neither Dependabot (which edits lockfiles without reading pyproject.toml)
    # nor a forgotten recompile can drift them from their inputs. See #59.
    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        version: "0.11.32"  # pin: different uv versions may format lockfiles differently

    - name: Check lockfiles are in sync
      run: ./scripts/check_lockfiles.sh

  # Detect what files changed to skip unnecessary jobs, and pick the test
  # matrix: PRs get a slim Linux-only matrix for fast feedback; pushes to
  # main, release tags, and manual runs get the full OS x Python matrix.
  # See issue #57.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      notebooks: ${{ steps.filter.outputs.notebooks }}
      test-matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - name: Select test matrix
        id: matrix
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Slim per-PR matrix: oldest + newest Python on Linux, plus the
            # ubuntu-3.11 coverage-gate cell.
            echo 'matrix={"include":[
              {"os":"ubuntu-latest","python-version":"3.10"},
              {"os":"ubuntu-latest","python-version":"3.11"},
              {"os":"ubuntu-latest","python-version":"3.13"}
            ]}' | tr -d '\n' >> "$GITHUB_OUTPUT"
          else
            # Full matrix on push to main, release tags, and workflow_dispatch.
            echo 'matrix={"include":[
              {"os":"ubuntu-latest","python-version":"3.10"},
              {"os":"ubuntu-latest","python-version":"3.11"},
              {"os":"ubuntu-latest","python-version":"3.12"},
              {"os":"ubuntu-latest","python-version":"3.13"},
              {"os":"macos-latest","python-version":"3.11"},
              {"os":"macos-latest","python-version":"3.12"},
              {"os":"macos-latest","python-version":"3.13"},
              {"os":"windows-latest","python-version":"3.11"},
              {"os":"windows-latest","python-version":"3.12"},
              {"os":"windows-latest","python-version":"3.13"}
            ]}' | tr -d '\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'setup.cfg'
              - 'setup.py'
              - '.pre-commit-config.yaml'
              - '.github/workflows/**'
              - 'requirements/**'
            docs:
              - 'docs/**'
              - '*.md'
            notebooks:
              - 'notebooks/**'

  typecheck:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --require-hashes -r requirements/typecheck.txt
        pip install --no-deps -e .

    - name: Run type checking (mypy)
      run: mypy src/boofun --no-color-output

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: [lint, changes]
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.test-matrix) }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        pip install --require-hashes -r requirements/ci.txt
        pip install --no-deps -e .

    - name: Run tests
      # The ubuntu-3.11 cell runs the suite under coverage below instead;
      # running it twice would double that job's wall time.
      if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.11'
      run: pytest tests/ -v --tb=short --timeout=120

    - name: Run tests with coverage
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      run: |
        pytest tests/ --cov=boofun --cov-branch \
          --cov-report=xml --cov-report=term-missing --timeout=120

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: false
        verbose: true

  # Stable aggregate check for branch protection: mark this (not individual
  # matrix cells) as required, so the required-checks list survives matrix
  # changes (issue #57). Passes when tests succeed or are legitimately
  # skipped (docs-only changes); fails on failure or cancellation.
  tests-pass:
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Check test matrix result
        run: |
          result="${{ needs.test.result }}"
          echo "test matrix result: $result"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            exit 1
          fi

  notebooks:
    runs-on: ubuntu-latest
    needs: [lint, changes]
    if: needs.changes.outputs.notebooks == 'true' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --require-hashes -r requirements/ci.txt
        pip install --no-deps -e .

    - name: Validate notebooks
      run: |
        # Run key notebooks to ensure they execute without errors
        for notebook in \
          notebooks/lecture1_fourier_expansion.ipynb \
          notebooks/lecture2_linearity_testing.ipynb \
          notebooks/hw1_fourier_expansion.ipynb \
          notebooks/real_world_applications.ipynb \
          notebooks/error_models.ipynb
        do
          echo "Testing: $notebook"
          jupyter nbconvert --to notebook --execute "$notebook" \
            --ExecutePreprocessor.timeout=120 \
            --output /tmp/test_output.ipynb
        done

        # GPU notebook: validate syntax only (no GPU in CI)
        echo "Syntax-checking: notebooks/gpu_performance.ipynb"
        python -c "import json; json.load(open('notebooks/gpu_performance.ipynb'))"

  mutation:
    runs-on: ubuntu-latest
    needs: test
    # Off the PR critical path (issue #57): runs with the full matrix on
    # pushes to main and manual dispatch.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --require-hashes -r requirements/ci.txt
        pip install --no-deps -e .

    - name: Run mutation testing (core modules)
      run: |
        # Run mutation testing on critical modules only (full run too slow).
        # mutmut 3.x: paths come from [tool.mutmut] in pyproject.toml;
        # restrict to optimizations via a mutant-name pattern.
        mutmut run "src.boofun.core.optimizations*" || true
        mutmut results

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    # Only run on releases or manual trigger (not PRs - too slow)
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --require-hashes -r requirements/ci.txt
        pip install --no-deps -e .

    - name: Run benchmarks
      run: |
        python << 'EOF'
        import boofun as bf
        import time
        from boofun.analysis import SpectralAnalyzer
        from boofun.analysis.query_complexity import QueryComplexityProfile

        print('=== Boolean Function Library Benchmarks ===')
        print()

        for n in [6, 8, 10]:  # Skip n=12 (too slow for CI)
            print(f'n={n}:')

            start = time.time()
            maj = bf.majority(n)
            print(f'  Create Majority: {(time.time() - start)*1000:.2f}ms')

            start = time.time()
            analyzer = SpectralAnalyzer(maj)
            fourier = analyzer.fourier_expansion()
            print(f'  Fourier expansion: {(time.time() - start)*1000:.2f}ms')

            start = time.time()
            influences = analyzer.influences()
            print(f'  Compute influences: {(time.time() - start)*1000:.2f}ms')

            start = time.time()
            profile = QueryComplexityProfile(maj)
            profile.compute()
            print(f'  Full BFW profile: {(time.time() - start)*1000:.2f}ms')

            print()
        EOF

  docs:
    runs-on: ubuntu-latest
    # Serialize gh-pages deployments: back-to-back merges to main used to
    # race on the force-push and fail with "cannot lock ref". Per-ref group
    # so PR builds (which don't deploy) are unaffected.
    concurrency:
      group: docs-deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --require-hashes -r requirements/ci.txt
        pip install --no-deps -e .

    - name: Build documentation
      run: |
        cd docs
        make html

    - name: Convert notebooks to HTML
      run: |
        mkdir -p docs/_build/html/notebooks
        # nbconvert comes from requirements/ci.txt
        # Convert all notebooks (lecture, homework, and supplementary)
        for nb in notebooks/*.ipynb; do
          jupyter nbconvert --to html "$nb" --output-dir docs/_build/html/notebooks/
        done

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/html
        force_orphan: true

  publish:
    needs: [test, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5
      with:
        python-version: '3.11'

    - name: Install build tools
      run: pip install --require-hashes -r requirements/publish.txt

    - name: Build package
      run: python -m build

    - name: Sign artifacts with Sigstore
      uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1  # v3.4.0
      with:
        inputs: ./dist/*

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: |
        if [ -z "$TWINE_PASSWORD" ]; then
          echo "::warning::PYPI_TOKEN secret not configured, skipping publish"
          exit 0
        fi
        twine upload dist/*.whl dist/*.tar.gz

  # Post-merge full-matrix failures must not be silent (issue #57): file a
  # tracking issue (or ping the existing one) with a link to the red run.
  report-failure:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, tests-pass, notebooks, mutation, docs]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      issues: write
    steps:
      - name: Open or ping CI-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CI is red on main"
          body="Full-matrix run failed on \`main\`: $RUN_URL (commit ${{ github.sha }})"
          existing=$(gh issue list -R "${{ github.repository }}" --state open \
            --label ci --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "${{ github.repository }}" --body "$body"
          else
            gh issue create -R "${{ github.repository }}" --title "$title" \
              --label ci --body "$body"
          fi
