name: Fuzz Testing

# Off the PR critical path (issue #57): fuzzing runs post-merge and weekly.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 3'  # Weekly on Wednesday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5
        with:
          # atheris >= 3.1 only ships cp312+ Linux wheels
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements/fuzz.txt
          pip install --no-deps -e .

      - name: Run Hypothesis fuzz tests
        run: |
          pytest tests/ -v -k "property or fuzz" --hypothesis-seed=0 \
            --hypothesis-profile=ci -x
        env:
          HYPOTHESIS_PROFILE: ci

      - name: Run atheris fuzzer on core functions
        run: |
          python << 'EOF'
          import atheris
          import sys

          with atheris.instrument_imports():
              import boofun as bf
              import numpy as np

          def test_create_from_bytes(data):
              """Fuzz test bf.create with random bytes."""
              fdp = atheris.FuzzedDataProvider(data)
              n = fdp.ConsumeIntInRange(1, 8)
              size = 2 ** n
              values = [fdp.ConsumeBool() for _ in range(size)]
              try:
                  f = bf.create(values)
                  # Should not crash
                  f.evaluate(0)
                  f.fourier()
              except (ValueError, TypeError):
                  pass  # Expected for invalid inputs

          def test_evaluate_from_bytes(data):
              """Fuzz test evaluate with random inputs."""
              fdp = atheris.FuzzedDataProvider(data)
              n = fdp.ConsumeIntInRange(2, 6)
              f = bf.majority(n)
              idx = fdp.ConsumeIntInRange(0, 2**n - 1)
              try:
                  f.evaluate(idx)
              except (ValueError, IndexError):
                  pass

          # Run for limited time in CI
          atheris.Setup(sys.argv, test_create_from_bytes)
          atheris.Fuzz()
          EOF
        timeout-minutes: 5
        continue-on-error: true  # Fuzzing may find issues, don't fail CI

  # Fuzzing now only runs unattended (post-merge / weekly), so a red run
  # must file or ping a tracking issue instead of failing silently.
  report-failure:
    runs-on: ubuntu-latest
    needs: [fuzz]
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Open or ping CI-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CI is red on main"
          body="Fuzz run failed: $RUN_URL (commit ${{ github.sha }})"
          existing=$(gh issue list -R "${{ github.repository }}" --state open \
            --label ci --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "${{ github.repository }}" --body "$body"
          else
            gh issue create -R "${{ github.repository }}" --title "$title" \
              --label ci --body "$body"
          fi
