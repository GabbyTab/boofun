name: Cross-Validation (live)

# Live cross-validation against external libraries (issue #79).
#
# The pinned SageMath fixtures run per-PR as plain pytest; this workflow
# covers the comparisons that need an external library actually installed.
# BoolForge is commit-pinned (full SHA, Scorecard-compliant); its runtime
# dependencies are hash-locked in requirements/boolforge.txt. Runs on main
# pushes, weekly, and on demand — a red run files or pings a tracking issue.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday
  workflow_dispatch:

permissions:
  contents: read

env:
  # Bump deliberately (BoolForge v1.0.1, 2026-06-11) and recompile
  # requirements/boolforge.txt if its dependencies changed.
  BOOLFORGE_REF: adae76be218eb8761e02d3c14a1d994764441102

jobs:
  boolforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements/boolforge.txt
          pip install --no-deps -e .
          pip install --no-deps "boolforge @ git+https://github.com/ckadelka/BoolForge@${BOOLFORGE_REF}"

      - name: Verify BoolForge imports (tests must not silently skip)
        run: python -c "import boolforge; print('boolforge OK')"

      - name: Run BoolForge cross-validation
        run: pytest tests/cross_validation/test_boolforge.py -v

  # This suite runs unattended (post-merge / weekly), so a red run must
  # file or ping a tracking issue instead of failing silently.
  report-failure:
    runs-on: ubuntu-latest
    needs: [boolforge]
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Open or ping CI-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CI is red on main"
          body="BoolForge cross-validation failed: $RUN_URL (commit ${{ github.sha }})"
          existing=$(gh issue list -R "${{ github.repository }}" --state open \
            --label ci --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "${{ github.repository }}" --body "$body"
          else
            gh issue create -R "${{ github.repository }}" --title "$title" \
              --label ci --body "$body"
          fi
